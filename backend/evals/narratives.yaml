# Generated by backend/evals/build_suite.py; run `python -m evals.build_suite` to refresh.
name: predictive-care-narratives
description: Generated by evals/build_suite.py. Do not edit by hand.
system: You explain a risk model's output to a clinician. Use only the factors listed. For each factor say whether it raises or lowers the model's risk score, exactly as given, and name them from largest to smallest impact, one factor per clause. Describe statistical association only; do not claim any factor produces the outcome. Do not give medication amounts or medication changes. Do not name or suggest any medical condition for this patient.
max_tokens: 600
temperature: 0.0
pass_rate: 0.8
critical_check_types:
- security
- logic
regression:
  pass_rate_drop: 0.2
  mean_score_drop: 0.2
examples:
