name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check backend/

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-asyncio httpx
      - run: python -m pytest tests/ -v
        env:
          # never connected to: the tests mock the database layer
          DATABASE_URL: "postgresql+asyncpg://ci@localhost:5432/ci"
          DATABASE_URL_SYNC: "postgresql://ci@localhost:5432/ci"
          JWT_SECRET: "test-secret"
          ENVIRONMENT: "test"
